name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax
        shell: bash
        run: |
          set -eu
          sh -n vp.sh
          sh -n install.sh
          for file in tests/*.sh; do sh -n "$file"; done
      - name: Verify script checksum
        shell: bash
        run: |
          set -eu
          expected="$(awk 'NR==1{print tolower($1)}' vp.sh.sha256)"
          actual="$(sha256sum vp.sh | awk '{print tolower($1)}')"
          test "$expected" = "$actual"
      - name: Enforce real-host isolation policy
        shell: bash
        run: |
          set -eu
          test ! -e tests/system_argo_test.sh
          test ! -e tests/system_pressure_test.sh
          grep -Fq 'ACCEPT_HOST="134.209.180.134"' tests/isolated_acceptance.sh
          grep -Fq 'ACCEPT_HOST="134.209.180.134"' tests/memory_profiles.sh
          ! grep -R 'VP_ACCEPT_HOST' tests
          grep -Fq "\$AuthorizedHost = '134.209.180.134'" tests/run_authorized_host.ps1
          grep -Fq "\$AuthorizedPort = 18750" tests/run_authorized_host.ps1
          grep -Fq "'BatchMode=yes'" tests/run_authorized_host.ps1
          grep -Fq "'PasswordAuthentication=no'" tests/run_authorized_host.ps1
          grep -Fq "'PreferredAuthentications=publickey'" tests/run_authorized_host.ps1
          grep -Fq "vp.sh vp.sh.sha256 tests/isolated_acceptance.sh tests/memory_profiles.sh" tests/run_authorized_host.ps1
          grep -Fq '[string]$TunnelTokenFile' tests/run_authorized_host.ps1
          grep -Fq '[string]$TunnelHost' tests/run_authorized_host.ps1
          grep -Fq '[string]$TunnelPath' tests/run_authorized_host.ps1
          grep -Fq '[int]$TunnelOriginPort' tests/run_authorized_host.ps1
          grep -Fq '[switch]$ValidateOnly' tests/run_authorized_host.ps1
          ! grep -Eqi 'sshpass|plink|PreferredAuthentications=password|PasswordAuthentication=yes' tests/run_authorized_host.ps1
          ! grep -Eq '(^|[^A-Za-z])TunnelToken[[:space:]]*=' tests/run_authorized_host.ps1
          ! grep -Eq '^[[:space:]]*\[(string|int)\]\$Authorized(Host|Port)' tests/run_authorized_host.ps1
      - name: Check authorized-host PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tests/run_authorized_host.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Test authorized-host runner parameter validation
        shell: pwsh
        run: |
          $runner = './tests/run_authorized_host.ps1'
          & $runner -ValidateOnly

          & $runner -ValidateOnly -TunnelTokenFile /root/independent-test.token -TunnelHost test.example.com -TunnelPath /private-test -TunnelOriginPort 25443

          $invalidCases = @(
            @('-ValidateOnly', '-TunnelHost', 'test.example.com'),
            @('-ValidateOnly', '-TunnelTokenFile', 'relative.token', '-TunnelHost', 'test.example.com', '-TunnelPath', '/private-test', '-TunnelOriginPort', '25443'),
            @('-ValidateOnly', '-TunnelTokenFile', '/etc/cloudflared/token', '-TunnelHost', 'test.example.com', '-TunnelPath', '/private-test', '-TunnelOriginPort', '25443'),
            @('-ValidateOnly', '-TunnelTokenFile', '/root/independent-test.token', '-TunnelHost', 'bad..example.com', '-TunnelPath', '/private-test', '-TunnelOriginPort', '25443'),
            @('-ValidateOnly', '-TunnelTokenFile', '/root/independent-test.token', '-TunnelHost', 'test.example.com', '-TunnelPath', 'private-test', '-TunnelOriginPort', '25443'),
            @('-ValidateOnly', '-TunnelTokenFile', '/root/independent-test.token', '-TunnelHost', 'test.example.com', '-TunnelPath', '/private-test', '-TunnelOriginPort', '53')
          )
          foreach ($case in $invalidCases) {
            $failedAsExpected = $false
            try { & $runner @case } catch { $failedAsExpected = $true }
            if (-not $failedAsExpected) {
              Write-Error "Invalid runner parameters were accepted: $($case -join ' ')"
              exit 1
            }
          }
      - name: Run portable smoke test
        shell: bash
        run: |
          sudo sh tests/smoke.sh
          sudo sh tests/install_smoke.sh
