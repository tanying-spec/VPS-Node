name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax
        shell: bash
        run: |
          set -eu
          sh -n vp.sh
          sh -n install.sh
          for file in tests/*.sh; do sh -n "$file"; done
      - name: Verify script checksum
        shell: bash
        run: |
          set -eu
          expected="$(awk 'NR==1{print tolower($1)}' vp.sh.sha256)"
          actual="$(sha256sum vp.sh | awk '{print tolower($1)}')"
          test "$expected" = "$actual"
      - name: Enforce real-host isolation policy
        shell: bash
        run: |
          set -eu
          test ! -e tests/system_argo_test.sh
          test ! -e tests/system_pressure_test.sh
          grep -Fq 'ACCEPT_HOST="134.209.180.134"' tests/isolated_acceptance.sh
          grep -Fq 'ACCEPT_HOST="134.209.180.134"' tests/memory_profiles.sh
          ! grep -R 'VP_ACCEPT_HOST' tests
      - name: Run portable smoke test
        shell: bash
        run: |
          sudo sh tests/smoke.sh
          sudo sh tests/install_smoke.sh
